---
- name: Ansible Action Smoke Test
  hosts: rhel_servers
  gather_facts: false
  become: false
  tasks:
    - name: Verify remote SSH command execution
      raw: "echo ANSIBLE_SMOKE_TEST_OK"
      register: smoke_result
      changed_when: false

    - name: Show smoke test output
      debug:
        var: smoke_result.stdout
