---
###############################################################################
# Phase 2A: Linux Server Patching Only
# Supports: RHEL 6, RHEL 7, RHEL 8, RHEL 9
# Purpose : Apply OS patches only. No reboot.
###############################################################################

- name: Linux Server Patching Only - RHEL 6/7/8/9
  hosts: all

  remote_user: sysadmin
  become: true
  become_method: sudo
  become_user: root

  gather_facts: true
  ignore_unreachable: true

  ###########################################################################
  # Patch one server at a time for safer production execution.
  # Change to serial: 5 or higher if you want batch patching.
  ###########################################################################
  serial: 1

  vars:
    patch_root: "/var/log/ansible_patching"

    mail_to: "wesco-linux@wescodist.com"
    mail_from: "ansible-patching@wescodist.com"

    ###########################################################################
    # Package exclusion list
    #
    # java*     excludes packages starting with java
    # *java*    excludes packages containing java anywhere in the package name
    # firefox*  excludes firefox packages
    ###########################################################################
    yum_exclude_options: "--exclude=java* --exclude=*java* --exclude=firefox*"
    dnf_exclude_options: "--exclude=java* --exclude=*java* --exclude=firefox*"

  tasks:

    ###########################################################################
    # Initialize patch status
    ###########################################################################
    - name: Initialize patch status
      ansible.builtin.set_fact:
        patch_status: "SUCCESS"
        patch_failed_task: "none"
        patch_failed_msg: "none"
        patch_failure_log_detail: "none"
        patch_dir: "not_created"
        patch_log: "not_created"
        patch_count: "0"
        os_major_version: "{{ ansible_facts.distribution_major_version | default('unknown') }}"
        patch_manager: "unknown"
        kernel_before: "unknown"
        yum_update_log: "not_created"
        dnf_update_log: "not_created"
        check_update_rc: "not_run"
        check_update_status: "not_run"

    ###########################################################################
    # Main patch workflow
    ###########################################################################
    - name: Patching workflow
      block:

        #######################################################################
        # Validate supported OS
        #######################################################################
        - name: Validate this is a supported Red Hat system
          ansible.builtin.fail:
            msg: >-
              Unsupported OS detected.
              Distribution={{ ansible_facts.distribution | default('unknown') }},
              Major Version={{ ansible_facts.distribution_major_version | default('unknown') }}.
              This playbook supports RHEL 6, 7, 8, and 9.
          when: >
            ansible_facts.distribution_major_version is not defined or
            ansible_facts.distribution_major_version | int not in [6, 7, 8, 9]

        - name: Set package manager type
          ansible.builtin.set_fact:
            patch_manager: "{{ 'yum' if ansible_facts.distribution_major_version | int <= 7 else 'dnf' }}"

        #######################################################################
        # Create timestamp and patch directory
        #######################################################################
        - name: Create patch timestamp
          ansible.builtin.set_fact:
            run_ts: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"

        - name: Set patch directory
          ansible.builtin.set_fact:
            patch_dir: "{{ patch_root }}/{{ inventory_hostname }}/{{ run_ts }}"

        - name: Set patch log file
          ansible.builtin.set_fact:
            patch_log: "{{ patch_dir }}/patching.log"
            yum_update_log: "{{ patch_dir }}/yum_update.log"
            dnf_update_log: "{{ patch_dir }}/dnf_update.log"

        #######################################################################
        # Verify sudo/root access
        #######################################################################
        - name: Verify sysadmin sudo to root
          ansible.builtin.command: id
          register: sudo_test
          changed_when: false

        - name: Fail if effective user is not root
          ansible.builtin.fail:
            msg: "Connected as sysadmin but sudo to root failed. Current user details: {{ sudo_test.stdout }}"
          when: "'uid=0(root)' not in sudo_test.stdout"

        #######################################################################
        # Create patch directory and log file
        #######################################################################
        - name: Create patch directory
          ansible.builtin.file:
            path: "{{ patch_dir }}"
            state: directory
            mode: "0755"

        - name: Create patch log file
          ansible.builtin.file:
            path: "{{ patch_log }}"
            state: touch
            mode: "0644"

        - name: Validate patch log file exists
          ansible.builtin.stat:
            path: "{{ patch_log }}"
          register: patch_log_stat

        - name: Fail if patch log file was not created
          ansible.builtin.fail:
            msg: "Patch log file was not created: {{ patch_log }}"
          when: not patch_log_stat.stat.exists

        - name: Log - patching started
          ansible.builtin.lineinfile:
            path: "{{ patch_log }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} START patching on {{ inventory_hostname }} RHEL {{ os_major_version }} using {{ patch_manager }}"
            insertafter: EOF

        #######################################################################
        # Capture pre-patch state
        #######################################################################
        - name: Capture kernel before patching
          ansible.builtin.command: uname -r
          register: kernel_before_cmd
          changed_when: false

        - name: Set kernel before fact
          ansible.builtin.set_fact:
            kernel_before: "{{ kernel_before_cmd.stdout | default('unknown') }}"

        - name: Save kernel before patching
          ansible.builtin.copy:
            dest: "{{ patch_dir }}/kernel_before.txt"
            content: "{{ kernel_before }}\n"
            mode: "0644"

        - name: Save filesystem information before patching
          ansible.builtin.shell: |
            set -o pipefail
            df -khP > "{{ patch_dir }}/df_before_patch.txt"
          args:
            executable: /bin/bash

        - name: Save package inventory before patching
          ansible.builtin.shell: |
            set -o pipefail
            rpm -qa | sort > "{{ patch_dir }}/rpm_before_patch.txt"
          args:
            executable: /bin/bash

        - name: Validate rpm_before_patch.txt exists
          ansible.builtin.stat:
            path: "{{ patch_dir }}/rpm_before_patch.txt"
          register: rpm_before_stat

        - name: Fail if package inventory before patching was not created
          ansible.builtin.fail:
            msg: "rpm_before_patch.txt was not created successfully under {{ patch_dir }}"
          when: not rpm_before_stat.stat.exists or rpm_before_stat.stat.size | int == 0

        - name: Log - pre-patch state captured
          ansible.builtin.lineinfile:
            path: "{{ patch_log }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} SUCCESS pre-patch state captured. Kernel={{ kernel_before }}"
            insertafter: EOF

        #######################################################################
        # Package manager lock validation
        #######################################################################
        - name: Check package manager lock
          ansible.builtin.shell: |
            set -o pipefail

            if pgrep -x yum >/dev/null 2>&1; then
              echo "ERROR: yum process is already running"
              exit 1
            fi

            if pgrep -x dnf >/dev/null 2>&1; then
              echo "ERROR: dnf process is already running"
              exit 1
            fi

            if pgrep -x rpm >/dev/null 2>&1; then
              echo "ERROR: rpm process is already running"
              exit 1
            fi

            if [ -f /var/run/yum.pid ]; then
              echo "ERROR: /var/run/yum.pid exists. Another yum process may be running."
              exit 1
            fi

            echo "PACKAGE_MANAGER_AVAILABLE"
          args:
            executable: /bin/bash
          register: package_lock_check
          changed_when: false

        - name: Log - package manager lock check passed
          ansible.builtin.lineinfile:
            path: "{{ patch_log }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} SUCCESS package manager lock check passed"
            insertafter: EOF

        #######################################################################
        # Clean package cache
        #######################################################################
        - name: Clean yum cache on RHEL 6 and RHEL 7
          ansible.builtin.shell: |
            set -o pipefail
            yum clean all
          args:
            executable: /bin/bash
          when: ansible_facts.distribution_major_version | int <= 7
          register: yum_clean_result
          changed_when: false

        - name: Clean dnf cache on RHEL 8 and RHEL 9
          ansible.builtin.shell: |
            set -o pipefail
            dnf clean all
          args:
            executable: /bin/bash
          when: ansible_facts.distribution_major_version | int >= 8
          register: dnf_clean_result
          changed_when: false

        - name: Log - package cache cleaned
          ansible.builtin.lineinfile:
            path: "{{ patch_log }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} SUCCESS package cache cleaned using {{ patch_manager }}"
            insertafter: EOF

        #######################################################################
        # Capture available updates before patching
        #
        # IMPORTANT:
        # yum/dnf check-update is informational only.
        # The actual yum update/dnf update task determines patch success.
        #######################################################################
        - name: Capture available updates on RHEL 6 and RHEL 7
          ansible.builtin.shell: |
            set -o pipefail

            yum check-update {{ yum_exclude_options }} > "{{ patch_dir }}/available_updates_before.txt" 2>&1
            rc=$?

            echo "$rc" > "{{ patch_dir }}/check_update_rc.txt"

            echo "" >> "{{ patch_dir }}/available_updates_before.txt"
            echo "============================================================" >> "{{ patch_dir }}/available_updates_before.txt"
            echo "yum check-update return code: $rc" >> "{{ patch_dir }}/available_updates_before.txt"

            if [ $rc -eq 0 ]; then
              echo "INFO: No updates available." >> "{{ patch_dir }}/available_updates_before.txt"
            elif [ $rc -eq 100 ]; then
              echo "INFO: Updates available." >> "{{ patch_dir }}/available_updates_before.txt"
            else
              echo "WARNING: yum check-update returned non-standard rc=$rc." >> "{{ patch_dir }}/available_updates_before.txt"
              echo "WARNING: Continuing because check-update is informational only." >> "{{ patch_dir }}/available_updates_before.txt"
              echo "WARNING: Actual yum update task will determine patch success or failure." >> "{{ patch_dir }}/available_updates_before.txt"
            fi

            exit 0
          args:
            executable: /bin/bash
          when: ansible_facts.distribution_major_version | int <= 7
          register: yum_check_update_result
          changed_when: false
          failed_when: false

        - name: Capture available updates on RHEL 8 and RHEL 9
          ansible.builtin.shell: |
            set -o pipefail

            dnf check-update {{ dnf_exclude_options }} > "{{ patch_dir }}/available_updates_before.txt" 2>&1
            rc=$?

            echo "$rc" > "{{ patch_dir }}/check_update_rc.txt"

            echo "" >> "{{ patch_dir }}/available_updates_before.txt"
            echo "============================================================" >> "{{ patch_dir }}/available_updates_before.txt"
            echo "dnf check-update return code: $rc" >> "{{ patch_dir }}/available_updates_before.txt"

            if [ $rc -eq 0 ]; then
              echo "INFO: No updates available." >> "{{ patch_dir }}/available_updates_before.txt"
            elif [ $rc -eq 100 ]; then
              echo "INFO: Updates available." >> "{{ patch_dir }}/available_updates_before.txt"
            else
              echo "WARNING: dnf check-update returned non-standard rc=$rc." >> "{{ patch_dir }}/available_updates_before.txt"
              echo "WARNING: Continuing because check-update is informational only." >> "{{ patch_dir }}/available_updates_before.txt"
              echo "WARNING: Actual dnf update task will determine patch success or failure." >> "{{ patch_dir }}/available_updates_before.txt"
            fi

            exit 0
          args:
            executable: /bin/bash
          when: ansible_facts.distribution_major_version | int >= 8
          register: dnf_check_update_result
          changed_when: false
          failed_when: false

        - name: Read actual check-update return code from file
          ansible.builtin.shell: |
            if [ -f "{{ patch_dir }}/check_update_rc.txt" ]; then
              cat "{{ patch_dir }}/check_update_rc.txt"
            else
              echo "unknown"
            fi
          args:
            executable: /bin/bash
          register: actual_check_update_rc_cmd
          changed_when: false
          failed_when: false

        - name: Set actual check-update return code fact
          ansible.builtin.set_fact:
            check_update_rc: "{{ actual_check_update_rc_cmd.stdout | trim }}"
            check_update_status: "COMPLETED_INFORMATIONAL"

        - name: Log - available updates check completed
          ansible.builtin.lineinfile:
            path: "{{ patch_log }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} INFO available updates check completed with exclusions. Actual check-update rc={{ check_update_rc }}. Non-zero check-update return codes are captured in available_updates_before.txt and do not stop patching."
            insertafter: EOF

        #######################################################################
        # Apply patches - RHEL 6 and RHEL 7
        #######################################################################
        - name: Patch RHEL 6 and RHEL 7 using yum with package exclusions
          ansible.builtin.shell: |
            set -o pipefail

            yum -y update {{ yum_exclude_options }} > "{{ yum_update_log }}" 2>&1
          args:
            executable: /bin/bash
          register: yum_patch_result
          when: ansible_facts.distribution_major_version | int <= 7

        #######################################################################
        # Apply patches - RHEL 8 and RHEL 9
        #######################################################################
        - name: Patch RHEL 8 and RHEL 9 using dnf with package exclusions
          ansible.builtin.shell: |
            set -o pipefail

            dnf -y update {{ dnf_exclude_options }} > "{{ dnf_update_log }}" 2>&1
          args:
            executable: /bin/bash
          register: dnf_patch_result
          when: ansible_facts.distribution_major_version | int >= 8

        - name: Log - patch command completed
          ansible.builtin.lineinfile:
            path: "{{ patch_log }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} SUCCESS patch command completed using {{ patch_manager }}"
            insertafter: EOF

        #######################################################################
        # Capture package inventory after patching
        #######################################################################
        - name: Save package inventory after patching
          ansible.builtin.shell: |
            set -o pipefail
            rpm -qa | sort > "{{ patch_dir }}/rpm_after_patch.txt"
          args:
            executable: /bin/bash

        - name: Validate rpm_after_patch.txt exists
          ansible.builtin.stat:
            path: "{{ patch_dir }}/rpm_after_patch.txt"
          register: rpm_after_stat

        - name: Fail if package inventory after patching was not created
          ansible.builtin.fail:
            msg: "rpm_after_patch.txt was not created successfully under {{ patch_dir }}"
          when: not rpm_after_stat.stat.exists or rpm_after_stat.stat.size | int == 0

        #######################################################################
        # Capture changed packages using rpm inventory diff
        #######################################################################
        - name: Capture newly installed or updated package inventory diff
          ansible.builtin.shell: |
            set -o pipefail

            comm -13 "{{ patch_dir }}/rpm_before_patch.txt" "{{ patch_dir }}/rpm_after_patch.txt" \
              > "{{ patch_dir }}/packages_changed.txt" || true

            if [ ! -s "{{ patch_dir }}/packages_changed.txt" ]; then
              echo "No RPM package changes detected by rpm inventory comparison." \
                > "{{ patch_dir }}/packages_changed.txt"
            fi
          args:
            executable: /bin/bash

        #######################################################################
        # Capture yum/dnf transaction summary separately
        #######################################################################
        - name: Capture yum transaction summary for RHEL 6 and RHEL 7
          ansible.builtin.shell: |
            set -o pipefail

            {
              echo "YUM transaction log summary"
              echo "============================================================"
              grep -Ei "Updated:|Installed:|Erased:|Dependency Updated:|Complete!" "{{ yum_update_log }}" || true
            } > "{{ patch_dir }}/package_manager_transaction_summary.txt"
          args:
            executable: /bin/bash
          when: ansible_facts.distribution_major_version | int <= 7

        - name: Capture dnf transaction summary for RHEL 8 and RHEL 9
          ansible.builtin.shell: |
            set -o pipefail

            {
              echo "DNF transaction log summary"
              echo "============================================================"
              grep -Ei "Upgraded:|Installed:|Removed:|Complete!" "{{ dnf_update_log }}" || true
            } > "{{ patch_dir }}/package_manager_transaction_summary.txt"
          args:
            executable: /bin/bash
          when: ansible_facts.distribution_major_version | int >= 8

        #######################################################################
        # Count package changes
        #######################################################################
        - name: Count changed packages
          ansible.builtin.shell: |
            set -o pipefail

            if grep -q "No RPM package changes detected" "{{ patch_dir }}/packages_changed.txt"; then
              echo 0
            else
              wc -l < "{{ patch_dir }}/packages_changed.txt"
            fi
          args:
            executable: /bin/bash
          register: patch_count_cmd
          changed_when: false

        - name: Set patch count fact
          ansible.builtin.set_fact:
            patch_count: "{{ patch_count_cmd.stdout | trim }}"

        #######################################################################
        # Save exclusion details
        #######################################################################
        - name: Save package exclusion details
          ansible.builtin.copy:
            dest: "{{ patch_dir }}/package_exclusions_used.txt"
            mode: "0644"
            content: |
              Package exclusions used during patching:
              ============================================================

              Exclusion command options:
              {{ yum_exclude_options if ansible_facts.distribution_major_version | int <= 7 else dnf_exclude_options }}

              Meaning:
              - --exclude=java*
                Excludes packages whose names start with java.

              - --exclude=*java*
                Excludes packages whose names contain java anywhere.

              - --exclude=firefox*
                Excludes packages whose names start with firefox.

              Notes:
              - These exclusions were applied to both check-update and update commands.
              - Java and Firefox packages were intentionally not updated by this playbook.
              - Other available OS packages were eligible for update.
              - The check-update step is informational only.
              - If check-update returns rc=1, the playbook logs it and continues.
              - The actual yum update or dnf update task determines patch success or failure.

        #######################################################################
        # Final success logging
        #######################################################################
        - name: Log - patching completed successfully
          ansible.builtin.lineinfile:
            path: "{{ patch_log }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} SUCCESS patching completed. Changed package count={{ patch_count }}. Reboot not performed."
            insertafter: EOF

        - name: Mark patching successful
          ansible.builtin.set_fact:
            patch_status: "SUCCESS"
            patch_failed_task: "none"
            patch_failed_msg: "none"
            patch_failure_log_detail: "none"

      #########################################################################
      # Enhanced error handling block
      #########################################################################
      rescue:

        #######################################################################
        # Capture yum/dnf update log tail if patch command failed
        #######################################################################
        - name: Capture yum update log tail for failed RHEL 6 and RHEL 7 patching
          ansible.builtin.shell: |
            if [ -f "{{ yum_update_log }}" ]; then
              echo "Last 80 lines from {{ yum_update_log }}"
              echo "============================================================"
              tail -80 "{{ yum_update_log }}"
            else
              echo "yum update log not found: {{ yum_update_log }}"
            fi
          args:
            executable: /bin/bash
          register: yum_failure_log_tail
          changed_when: false
          failed_when: false
          when: ansible_facts.distribution_major_version | int <= 7

        - name: Capture dnf update log tail for failed RHEL 8 and RHEL 9 patching
          ansible.builtin.shell: |
            if [ -f "{{ dnf_update_log }}" ]; then
              echo "Last 80 lines from {{ dnf_update_log }}"
              echo "============================================================"
              tail -80 "{{ dnf_update_log }}"
            else
              echo "dnf update log not found: {{ dnf_update_log }}"
            fi
          args:
            executable: /bin/bash
          register: dnf_failure_log_tail
          changed_when: false
          failed_when: false
          when: ansible_facts.distribution_major_version | int >= 8

        #######################################################################
        # Build readable failure message
        #######################################################################
        - name: Build patch failure log detail
          ansible.builtin.set_fact:
            patch_failure_log_detail: >-
              {{
                yum_failure_log_tail.stdout
                | default(dnf_failure_log_tail.stdout, true)
                | default('No yum/dnf failure log output captured.', true)
              }}

        - name: Mark patching failed and capture failure details
          ansible.builtin.set_fact:
            patch_status: "FAILED"
            patch_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            patch_failed_msg: >-
              Failed task={{ ansible_failed_task.name | default('unknown task') }}.
              Ansible error={{
                ansible_failed_result.msg
                | default(ansible_failed_result.stderr, true)
                | default(ansible_failed_result.stdout, true)
                | default(ansible_failed_result, true)
              }}.
              Package manager log tail:
              {{ patch_failure_log_detail }}

        - name: Create fallback patch failure log directory
          ansible.builtin.file:
            path: "/tmp/ansible_patch_failures"
            state: directory
            mode: "0755"
          ignore_errors: true

        - name: Write failure details to available log
          ansible.builtin.lineinfile:
            path: "{{ patch_log if patch_log != 'not_created' else '/tmp/ansible_patch_failures/' + inventory_hostname + '_patch_failed.log' }}"
            create: true
            mode: "0644"
            line: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }} ERROR task='{{ patch_failed_task }}' failure='{{ patch_failed_msg }}'"
            insertafter: EOF
          ignore_errors: true

        - name: Save package manager failure summary
          ansible.builtin.copy:
            dest: "{{ patch_dir }}/patch_failure_summary.txt"
            mode: "0644"
            content: |
              Patch Failure Summary
              ============================================================

              Host:
              {{ inventory_hostname }}

              Failed Task:
              {{ patch_failed_task }}

              Failure Message:
              {{ patch_failed_msg }}

              Patch Directory:
              {{ patch_dir }}

              Patch Log:
              {{ patch_log }}

              Yum Update Log:
              {{ yum_update_log }}

              DNF Update Log:
              {{ dnf_update_log }}

              Package Manager Failure Log Tail:
              ============================================================
              {{ patch_failure_log_detail }}

          ignore_errors: true

        - name: Display patch failure details
          ansible.builtin.debug:
            msg: >-
              Patching failed on {{ inventory_hostname }}.
              Failed task={{ patch_failed_task }}.
              Error={{ patch_failed_msg }}.

    ###########################################################################
    # Host status output
    ###########################################################################
    - name: Display host patch status
      ansible.builtin.debug:
        msg: >-
          Host={{ inventory_hostname }},
          Status={{ patch_status | default('UNKNOWN') }},
          OS_Major={{ os_major_version | default('unknown') }},
          Package_Manager={{ patch_manager | default('unknown') }},
          Kernel_Before={{ kernel_before | default('unknown') }},
          Check_Update_Status={{ check_update_status | default('not_run') }},
          Check_Update_RC={{ check_update_rc | default('not_run') }},
          Changed_Package_Count={{ patch_count | default('0') }},
          Patch_Dir={{ patch_dir | default('not_created') }},
          Patch_Log={{ patch_log | default('not_created') }}


###############################################################################
# Final Reporting Play
###############################################################################

- name: Final Linux Patching Only Report
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    mail_to: "wesco-linux@wescodist.com"
    mail_from: "ansible-patching@wescodist.com"

  tasks:

    - name: Initialize report variables
      ansible.builtin.set_fact:
        success_hosts: []
        failed_hosts: []
        report_lines: []

    - name: Build success host list
      ansible.builtin.set_fact:
        success_hosts: "{{ success_hosts + [item] }}"
      loop: "{{ groups['all'] }}"
      when: hostvars[item].patch_status | default('UNREACHABLE') == 'SUCCESS'

    - name: Build failed or unreachable host list
      ansible.builtin.set_fact:
        failed_hosts: "{{ failed_hosts + [item] }}"
      loop: "{{ groups['all'] }}"
      when: hostvars[item].patch_status | default('UNREACHABLE') != 'SUCCESS'

    - name: Build final report lines for all hosts
      ansible.builtin.set_fact:
        report_lines: "{{ report_lines + [report_entry] }}"
      vars:
        report_entry: |
          ------------------------------------------------------------
          Host: {{ item }}
          Status: {{ hostvars[item].patch_status | default('UNREACHABLE_OR_GATHER_FACTS_FAILED') }}
          OS Major Version: {{ hostvars[item].os_major_version | default('unknown') }}
          Package Manager: {{ hostvars[item].patch_manager | default('unknown') }}
          Kernel Before: {{ hostvars[item].kernel_before | default('unknown') }}
          Check-Update Status: {{ hostvars[item].check_update_status | default('not_run') }}
          Check-Update RC: {{ hostvars[item].check_update_rc | default('not_run') }}
          Changed Package Count: {{ hostvars[item].patch_count | default('0') }}
          Failed Task: {{ hostvars[item].patch_failed_task | default('SSH/SUDO/GATHER_FACTS') }}
          Failure Message: {{ hostvars[item].patch_failed_msg | default('SSH connection failed, sudo failed, patching failed, or gather_facts failed') }}
          Patch Directory: {{ hostvars[item].patch_dir | default('not_created') }}
          Patch Log: {{ hostvars[item].patch_log | default('not_created') }}
      loop: "{{ groups['all'] }}"

    - name: Create final patching report body
      ansible.builtin.set_fact:
        final_patch_report: |
          Linux Server Patching Only Report

          Summary:
          ============================================================
          Total Hosts              : {{ groups['all'] | length }}
          Successful Hosts         : {{ success_hosts | length }}
          Failed/Unreachable Hosts : {{ failed_hosts | length }}

          Package Exclusions Applied:
          ============================================================
          --exclude=java*
          --exclude=*java*
          --exclude=firefox*

          Important:
          ============================================================
          This playbook performed patching only.
          No reboot was performed by this playbook.

          The yum/dnf check-update step is informational only.
          If check-update returns rc=1, the playbook logs the output and continues.
          The actual yum update or dnf update task determines patch success or failure.

          If patching fails, the last 80 lines of the yum/dnf update log are captured
          in the email report and saved under the server patch directory.

          Supported OS Versions:
          ============================================================
          RHEL 6 - yum
          RHEL 7 - yum
          RHEL 8 - dnf
          RHEL 9 - dnf

          {% if failed_hosts | length == 0 %}
          Overall Status:
          ============================================================
          SUCCESS

          All servers completed the patching workflow successfully.

          Validation Completed:
          ============================================================
          - SSH communication successful
          - Login successful as sysadmin
          - sudo to root successful
          - Facts gathered successfully
          - Supported OS version validated
          - Patch directory created successfully
          - Patch log file created successfully
          - Kernel before patching captured
          - Filesystem usage before patching captured
          - RPM inventory before patching captured
          - Package manager lock check completed
          - Package cache cleaned
          - Available updates check completed with exclusions
          - Actual check-update RC captured for audit
          - Patching completed with exclusions
          - RPM inventory after patching captured
          - Changed package list generated
          - No reboot performed

          Successful Hosts:
          ============================================================
          {% for host in success_hosts %}
          - {{ host }}
          {% endfor %}

          Detailed Host Report:
          ============================================================
          {% for line in report_lines %}
          {{ line }}
          {% endfor %}

          {% else %}
          Overall Status:
          ============================================================
          FAILED

          One or more servers failed during patching or were unreachable.

          Failed/Unreachable Hosts:
          ============================================================
          {% for host in failed_hosts %}
          - {{ host }}
          {% endfor %}

          Detailed Host Report:
          ============================================================
          {% for line in report_lines %}
          {{ line }}
          {% endfor %}
          {% endif %}

          End of Report.

    - name: Display final patch report
      ansible.builtin.debug:
        msg: "{{ final_patch_report }}"

    - name: Set email subject
      ansible.builtin.set_fact:
        email_subject: >-
          {% if failed_hosts | length == 0 %}
          SUCCESS - Linux Server Patching Only Report
          {% else %}
          FAILED - Linux Server Patching Only Report
          {% endif %}

    - name: Save final patch report to local temp file
      ansible.builtin.copy:
        dest: "/tmp/linux_patching_only_report.txt"
        content: "{{ final_patch_report }}"
        mode: "0644"
      delegate_to: localhost

    ###########################################################################
    # Send email using local Linux mail utilities
    ###########################################################################
    - name: Send final patching email report using mailx/mail/sendmail
      ansible.builtin.shell: |
        set -o pipefail

        REPORT_FILE="/tmp/linux_patching_only_report.txt"
        MAIL_TO="{{ mail_to }}"
        MAIL_FROM="{{ mail_from }}"
        SUBJECT="{{ email_subject | trim }}"

        if command -v mailx >/dev/null 2>&1; then
          mailx -r "${MAIL_FROM}" -s "${SUBJECT}" "${MAIL_TO}" < "${REPORT_FILE}"
        elif command -v mail >/dev/null 2>&1; then
          mail -s "${SUBJECT}" "${MAIL_TO}" < "${REPORT_FILE}"
        elif command -v sendmail >/dev/null 2>&1; then
          {
            echo "From: ${MAIL_FROM}"
            echo "To: ${MAIL_TO}"
            echo "Subject: ${SUBJECT}"
            echo
            cat "${REPORT_FILE}"
          } | sendmail -t
        else
          echo "ERROR: No mailx, mail, or sendmail command found on Ansible control node."
          exit 1
        fi
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      register: email_send_result
      changed_when: true
      failed_when: false

    - name: Display email send result
      ansible.builtin.debug:
        msg: >-
          Email command return code={{ email_send_result.rc }}.
          stdout={{ email_send_result.stdout | default('') }}.
          stderr={{ email_send_result.stderr | default('') }}.
