[defaults]
forks = 50
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /var/cache/ansible_facts
fact_caching_timeout = 7200
callbacks_enabled = profile_tasks
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
# ponytail: pipelining needs !requiretty in sudoers. RHEL7+ ok by default;
# if any RHEL6 host errors with "sorry, you must have a tty", set pipelining=False.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey -o ServerAliveInterval=30
control_path = /tmp/.ansible-cp-%%h-%%p-%%r
