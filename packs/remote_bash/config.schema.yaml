---
github_token:
  description: >
    Optional GitHub personal access token for cloning private repositories.
  type: string
  secret: true
  required: false
allowed_scripts:
  description: >
    Optional allowlist of script basenames or repo-relative paths.
  type: array
  items:
    type: string
  required: false
  default: []
ssh_port:
  description: Default SSH port when not overridden per run or by hostfile.
  type: integer
  required: false
  default: 22
git_clone_timeout:
  description: Timeout in seconds for git clone operations.
  type: integer
  required: false
  default: 600
ssh_known_hosts_path:
  description: >
    Optional known_hosts file to load and persist new keys into (same path).
    When unset, ~/.ssh/known_hosts is used.
  type: string
  required: false
ssh_strict_host_key_checking:
  description: >
    When false (default), unknown keys are accepted once and saved. When true,
    require host keys to exist already (RejectPolicy).
  type: boolean
  required: false
  default: false
