---
delinea_url:
  description: >
    Base URL for Delinea Secret Server (e.g. https://tenant.secretservercloud.com).
    Optional if you only use inline SSH credentials (ssh_username / ssh_password / key)
    and never call get_delinea_secret or delinea_secret_id on run_remote_script.
  type: string
  required: false
delinea_client_id:
  description: OAuth2 client ID for Delinea API (client credentials). Required when using Delinea.
  type: string
  required: false
delinea_client_secret:
  description: OAuth2 client secret for Delinea API. Required when using Delinea.
  type: string
  secret: true
  required: false
github_token:
  description: >
    Optional GitHub personal access token for cloning private repositories.
    Store via StackStorm datastore or encrypted config.
  type: string
  secret: true
  required: false
allowed_scripts:
  description: >
    Optional allowlist of script basenames (e.g. ["deploy.sh", "patch.sh"]).
    When non-empty, only listed scripts may run. When empty, only path/extension
    validation applies.
  type: array
  items:
    type: string
  required: false
  default: []
ssh_port:
  description: SSH port on target hosts when not overridden per execution.
  type: integer
  required: false
  default: 22
git_clone_timeout:
  description: Default timeout in seconds for git clone operations.
  type: integer
  required: false
  default: 600
delinea_request_timeout:
  description: HTTP timeout in seconds for Delinea API calls.
  type: integer
  required: false
  default: 60
ssh_known_hosts_path:
  description: >
    Optional additional known_hosts file merged after loading the StackStorm user
    system keys (~/.ssh/known_hosts). Required entries must exist when using strict
    host key checking (recommended).
  type: string
  required: false
ssh_strict_host_key_checking:
  description: >
    When true (default), refuse SSH if the target host key is not in known_hosts
    (RejectPolicy). Set to false only for lab/testing — connections may be vulnerable
    to machine-in-the-middle attacks. Production: keep true and add keys with ssh-keyscan.
    Ignored when ssh_auto_add_host_key is true (new keys are accepted and saved).
  type: boolean
  required: false
  default: true
ssh_auto_add_host_key:
  description: >
    When true, unknown server host keys are accepted (AutoAddPolicy), then written to
    known_hosts after a successful connection so later runs verify normally. Saves to
    ssh_known_hosts_path if set, otherwise ~/.ssh/known_hosts. First connection still
    trusts the server identity on that hop (MITM risk on first connect); prefer manual
    ssh-keyscan in production.
  type: boolean
  required: false
  default: false
