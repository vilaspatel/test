---
name: get_delinea_secret
description: >
  Authenticate to Delinea Secret Server with OAuth2 client credentials and
  retrieve SSH username/password or private key fields for a secret ID.
runner_type: python-script
enabled: true
entry_point: get_delinea_secret.py
parameters:
  secret_id:
    type: string
    description: Delinea Secret Server secret identifier (numeric or string).
    required: true
output_schema:
  type: object
  properties:
    success: { type: boolean }
    ssh_username: { type: string }
    ssh_password: { type: string }
    ssh_private_key: { type: string }
    error: { type: string }
